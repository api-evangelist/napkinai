aid: napkinai
name: Napkin.AI
description: >-
  Napkin AI turns typed or pasted text into editable visuals — diagrams, charts,
  mind maps, icons, and infographics — and into full presentations, with no
  prompting or design skill required. Two products share the same text-to-visual
  engine: Napkin Visuals (standalone diagrams and graphics, exportable to PPT,
  PNG, PDF, or SVG) and Napkin Slides (beta AI presentation agent that builds a
  tailored, fully editable deck). A developer-preview REST API also generates
  visuals programmatically: submit text to POST /v1/visual, poll the request
  status, then download the generated PNG/SVG/PPT files. Authentication is by
  account API token (HTTP Bearer) or OAuth 2.0 (beta) with user and generation
  scopes. Napkin AI is backed by Accel.
